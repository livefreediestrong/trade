<section class="desk-module panel" id="trade-guards" aria-labelledby="trade-guards-title">
  <h3 class="module-title" id="trade-guards-title">Entry &amp; profit guards <span class="title-ctx">(paper and broker ideas)</span></h3>
  <form id="trade-guards-form"><div class="compact-form">
    <label title="After fees, slippage and the bid/ask spread, the target must pay at least this many times the risk to the stop. Setups below it become Watch.">Minimum reward to risk after costs · x<input id="tg-min_net_reward_risk" type="number" min="0" max="10" step="0.1" required /></label>
    <label class="chk"><input type="checkbox" id="tg-evidence_gate_enabled" /> Skip setups whose own scored record is losing after costs</label>
    <label title="How many scored trades of the same setup are needed before its record can block it.">Scored trades needed · count<input id="tg-evidence_min_samples" type="number" min="3" max="10000" step="1" required /></label>
    <label title="Once today's broker profit reaches a meaningful level, new risk pauses if more than this share of the day's best profit is given back. 0 turns this off. Exits are never blocked.">Pause after giving back · % of today's peak<input id="tg-giveback_stop_pct" type="number" min="0" max="100" step="1" required /></label>
  </div>
  <fieldset class="tg-group"><legend>Speeches &amp; releases</legend><div class="compact-form">
    <label class="chk"><input type="checkbox" id="tg-event_guard_enabled" /> Fox opens nothing new around high-impact events (FOMC, Fed Chair, CPI, jobs, presidential addresses)</label>
    <label>Pause before · minutes<input id="tg-event_guard_before_min" type="number" min="0" max="240" step="1" required /></label>
    <label>Pause after · minutes<input id="tg-event_guard_after_min" type="number" min="0" max="240" step="1" required /></label>
    <label class="tg-wide">Your own events · one per line: <code>2026-09-25 21:00 | President addresses the nation | high</code> (Eastern time; impact high, medium or low)<textarea id="tg-custom_market_events" rows="3" spellcheck="false"></textarea></label>
  </div></fieldset>
  <fieldset class="tg-group"><legend>WSB crowding</legend><div class="compact-form">
    <label>When a new buy is crowded on WSB<select id="tg-wsb_crowding_action"><option value="half">Buy half size</option><option value="skip">Skip it</option><option value="note">Note it only</option><option value="off">Ignore WSB</option></select></label>
    <label title="Crowded means at least this many mentions in the last hour, from many different people, plus a spike or a top-3 rank.">Crowded at · mentions per hour<input id="tg-wsb_crowd_min_mentions" type="number" min="5" max="10000" step="1" required /></label>
  </div></fieldset>
  <button class="btn" id="trade-guards-save" type="submit">Save guards</button></form>
  <p id="tg-status" role="status" class="hint-line keep-visible">These guards only pause, shrink or downgrade new entries; they never place orders.</p>
</section>
