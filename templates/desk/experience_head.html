{# Appearance never changes accounts, orders, or saved form values. #}
<script>
try {
 // v2 makes Simple the default view; v1 only carries the theme choices over.
 const r=document.documentElement, s=localStorage, v2=s.getItem('desk_appearance_v2');
 const p=JSON.parse(v2||s.getItem('desk_appearance_v1')||'{}');
 r.dataset.skin=['plain','desert'].includes(p.skin)?p.skin:p.skin==null?'desert':'plain';
 r.dataset.detail=v2&&['focused','full'].includes(p.detail)?p.detail:'focused';
 r.dataset.portraits=p.portraits===false?'off':'on';
} catch (_) { document.documentElement.dataset.skin='plain'; document.documentElement.dataset.detail='focused'; }
</script>
