<small id="app-version" style="display:block;margin-top:6px;font:10px var(--mono);color:var(--muted)">Version · …</small>
<script>
  (() => {
    const label = document.getElementById('app-version');
    fetch('/api/health', {cache: 'no-store'})
      .then(response => {
        if (!response.ok) throw new Error('Version unavailable');
        return response.json();
      })
      .then(({code}) => {
        const version = code?.serving || code?.started;
        if (!/^[a-f0-9]{16}$/.test(version || '')) throw new Error('Version unavailable');
        label.textContent = 'Version · ' + version.slice(0, 8);
        label.title = code.stale
          ? 'Desk started with build ' + version + '. Updated Python files are waiting for a restart.'
          : 'Current app files: ' + version + '. Reload an older open page to use updated browser files.';
      })
      .catch(() => { label.textContent = 'Version unavailable'; });
  })();
</script>
