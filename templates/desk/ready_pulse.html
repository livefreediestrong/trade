<section class="bx-card" id="beginner-ready" aria-labelledby="bx-ready-title">
  <h3 class="bx-card-title" id="bx-ready-title">Ready meter &amp; money <span class="bx-sub">Live account</span></h3>
  <p class="bx-plain">Quick read on whether new trades are allowed, how the day is going, and buying power.</p>
  <div class="bx-pulse-grid" id="beginner-pulse-grid">
    <div class="bx-money-card" id="bx-ready-card">
      <span class="bx-money-k">Desk ready?</span>
      <div class="bx-ready-row">
        <span class="bx-pulse-dot" id="bx-ready-dot" aria-hidden="true"></span>
        <span class="bx-money-v" id="bx-ready-label">Checking…</span>
      </div>
      <span class="bx-money-sub" id="bx-ready-sub">Waiting for broker day P&amp;L…</span>
    </div>
    <div class="bx-money-card" id="bx-pnl-card">
      <span class="bx-money-k">Today's profit / loss</span>
      <span class="bx-money-v" id="bx-day-pnl">—</span>
      <span class="bx-money-sub" id="bx-day-pnl-sub">Broker daily P&amp;L</span>
    </div>
    <div class="bx-money-card" id="bx-bp-card">
      <span class="bx-money-k">Buying power</span>
      <span class="bx-money-v" id="bx-buying-power">—</span>
      <span class="bx-money-sub" id="bx-buying-power-sub">Cash available to trade</span>
    </div>
    <div class="bx-money-card" id="bx-equity-card">
      <span class="bx-money-k">Account value</span>
      <span class="bx-money-v" id="bx-equity">—</span>
      <span class="bx-money-sub" id="bx-equity-sub">Equity at your broker</span>
    </div>
  </div>
</section>
